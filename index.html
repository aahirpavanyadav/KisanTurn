<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kisan Turn | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4fff0, #dff3d8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #1f3d1f;
    }

    .container {
      text-align: center;
      padding: 40px 25px;
      max-width: 800px;
      width: 90%;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 2rem;
      font-weight: 700;
      color: #1f7a35;
      margin-bottom: 45px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: #2e8b3c;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 20px rgba(46, 139, 60, 0.25);
    }

    /* Main Card */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 60px 35px;
      border-radius: 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(46, 139, 60, 0.1);
    }

    .construction-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 15px;
      color: #214d27;
    }

    h1 span {
      color: #2e8b3c;
    }

    .subtitle {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #5c6f5d;
      max-width: 600px;
      margin: 0 auto 35px;
    }

    /* Progress Bar */
    .progress-section {
      max-width: 500px;
      margin: auto;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #456348;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e4eee2;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, #2e8b3c, #76b852);
      border-radius: 20px;
      animation: load 2s ease;
    }

    .footer-text {
      margin-top: 35px;
      font-size: 0.9rem;
      color: #78907a;
    }

    /* Decorative circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(46, 139, 60, 0.08);
      z-index: -1;
    }

    .circle1 {
      width: 300px;
      height: 300px;
      top: -100px;
      left: -100px;
    }

    .circle2 {
      width: 400px;
      height: 400px;
      bottom: -180px;
      right: -100px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes load {
      from {
        width: 0;
      }

      to {
        width: 65%;
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 45px 20px;
      }

      .logo {
        margin-bottom: 30px;
      }

      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- Background Decorations -->
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>

  <div class="container">

    <!-- Brand -->
    <div class="logo">
      <div class="logo-icon">🌾</div>
      <span>Kisan Turn</span>
    </div>

    <!-- Construction Card -->
    <div class="card">

      <div class="construction-icon">🚧</div>

      <h1>We're <span>Growing</span> Something Better</h1>

      <p class="subtitle">
        Kisan Turn is currently under construction.
        We are building a smarter and simpler way to manage
        farmer procurement queues and track procurement status.
      </p>

      <div class="progress-section">

        <div class="progress-text">
          <span>Building Kisan Turn</span>
          <span>65%</span>
        </div>

        <div class="progress-bar">
          <div class="progress"></div>
        </div>

      </div>

      <p class="footer-text">
        🌱 A smarter procurement experience for every farmer.
      </p>

    </div>

  </div>

</body>
</html>
